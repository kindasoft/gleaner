<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark light">
<title>Send to Claude</title>
<style>
  :root { --bg: #1f1f1e; --bar: #262624; --text: #c2c0b6; --btn: #3a3936; --btn-hover: #4a4945; --btn-text: #eeeeea; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #faf9f5; --bar: #f0eee6; --text: #5b5a55; --btn: #e3e1d8; --btn-hover: #d6d3c8; --btn-text: #1f1f1e; }
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: flex; flex-direction: column; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bar); color: var(--text); flex-shrink: 0; }
  #bar.hidden { display: none; }
  #bar.busy::before { content: ""; width: 12px; height: 12px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 2px solid color-mix(in srgb, currentColor 25%, transparent); border-top-color: currentColor; animation: spin .7s linear infinite; }
  #status { flex: 1; }
  #open-tab { background: var(--btn); border: 0; border-radius: 8px; color: var(--btn-text); font: inherit; padding: 5px 12px; cursor: pointer; flex-shrink: 0; white-space: nowrap; }
  #open-tab:hover { background: var(--btn-hover); }
  #open-tab.hidden { display: none; }
  #frame { flex: 1; width: 100%; border: 0; display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="bar">
  <span id="status">Click Send under any YouTube video and it shows up here.</span>
  <button id="open-tab" class="hidden">Open in a tab</button>
</div>
<iframe id="frame" title="Claude" allow="clipboard-write"></iframe>
<script src="sidepanel.js"></script>
</body>
</html>
